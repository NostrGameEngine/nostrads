buildscript {
    repositories { mavenCentral() }
    dependencies {
        // Add ASM dependencies
        classpath 'org.ow2.asm:asm:9.5'
        classpath 'org.ow2.asm:asm-tree:9.5'
    }
}
 

plugins {
    id "io.github.gradle-nexus.publish-plugin" version "2.0.0" 
}

ext {
    repo="NostrGameEngine/nostrads"
    website="https://ngengine.org/nostrads"
    baseGroup="org.ngengine"
    description="A Nostr based Ads network"
    author="Riccardo Balbo"
    authorAlias="rblb"
    authorEmail="os@rblb.it"
    license="BSD 3-Clause License"
    licenseUrl="https://opensource.org/licenses/BSD-3-Clause"
    baseVersion="0.2.0-SNAPSHOT"
    baseGroup="org.ngengine"
}


allprojects {

    def projectVersion = System.getenv("VERSION")
    if (projectVersion == null || projectVersion.trim().isEmpty()) {
        projectVersion = rootProject.ext.baseVersion
    }
    def projectGroup = System.getenv("GROUP") ?: rootProject.ext.baseGroup 
    
    println "Using project version: ${projectVersion}"
    println "Using project group: ${projectGroup}"

    version = projectVersion
    group   = projectGroup


 
}

if(System.getenv("SONATYPE_USERNAME") || project.findProperty("sonatypeUsername")){
    nexusPublishing {
        repositories {
            sonatype {
                nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
                snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))

                username = System.getenv("SONATYPE_USERNAME") ?: project.findProperty("sonatypeUsername") ?: ""
                password = System.getenv("SONATYPE_PASSWORD") ?: project.findProperty("sonatypePassword") ?: ""
            }
        }
    }
}

tasks.register('refreshCatalog') {
    group = 'build setup'
    description = 'Downloads the central NostrGameEngine Gradle version catalog.'

    def catalogUrl = providers.gradleProperty('centralCatalogUrl')
        .orElse('https://raw.githubusercontent.com/NostrGameEngine/libs.catalog/main/libs.versions.toml')
    def outputFile = layout.projectDirectory.file('gradle/libs.versions.toml')

    outputs.file(outputFile)

    doLast {
        def target = outputFile.asFile
        def trackedSections = ['versions', 'libraries', 'bundles', 'plugins'] as Set
        def readCatalogEntries = { String catalogText ->
            def entries = trackedSections.collectEntries { [(it): new LinkedHashMap<String, String>()] }
            def currentSection = null

            catalogText.readLines().each { line ->
                def trimmed = line.trim()
                def sectionMatcher = trimmed =~ /^\[([A-Za-z0-9_.-]+)\]$/
                if (sectionMatcher.matches()) {
                    currentSection = sectionMatcher[0][1]
                    return
                }

                if (!trackedSections.contains(currentSection)) {
                    return
                }

                def entryMatcher = trimmed =~ /^([A-Za-z0-9_.-]+)\s*=/
                if (entryMatcher.find()) {
                    entries[currentSection][entryMatcher.group(1)] = line
                }
            }

            entries
        }

        def currentEntries = target.exists() ? readCatalogEntries(target.getText('UTF-8')) : [:]
        def remoteEntries = readCatalogEntries(new URI(catalogUrl.get()).toURL().getText('UTF-8'))
        def keptSections = ['libraries', 'bundles', 'plugins'].collectEntries { section ->
            def allowedKeys = currentEntries[section]?.keySet() ?: [] as Set
            [(section): remoteEntries[section].findAll { key, ignored -> allowedKeys.contains(key) }]
        }

        def referencedVersionKeys = new LinkedHashSet<String>()
        keptSections.values().each { sectionEntries ->
            sectionEntries.values().each { line ->
                def versionRefMatcher = line =~ /version\.ref\s*=\s*["']([^"']+)["']/
                versionRefMatcher.each { match ->
                    referencedVersionKeys.add(match[1])
                }
            }
        }
        def keptVersions = remoteEntries.versions.findAll { key, ignored -> referencedVersionKeys.contains(key) }

        def filteredCatalog = new StringBuilder()
        def appendSection = { String name, Map<String, String> entries ->
            if (entries.isEmpty()) {
                return
            }
            if (filteredCatalog.length() > 0) {
                filteredCatalog.append(System.lineSeparator()).append(System.lineSeparator())
            }
            filteredCatalog.append("[").append(name).append("]").append(System.lineSeparator())
            entries.values().each { line ->
                filteredCatalog.append(line).append(System.lineSeparator())
            }
        }

        appendSection('versions', keptVersions)
        appendSection('libraries', keptSections.libraries)
        appendSection('bundles', keptSections.bundles)
        appendSection('plugins', keptSections.plugins)

        target.parentFile.mkdirs()
        target.setText(filteredCatalog.toString(), 'UTF-8')
        println "Refreshed ${target} with ${keptSections.libraries.size()} catalog libraries"
    }
}
