name: Build and Publish

on:
  workflow_dispatch:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: build-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Build and test
        run: ./gradlew --no-daemon build javadoc :nostrads-js:packJsClient :nostrads-js:browserRendererTest
      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: dist

  publish_maven:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Publish artifacts
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            ./gradlew --no-daemon publishAllPublicationsToDistFolder publishToSonatype closeAndReleaseSonatypeStagingRepository
          else
            ./gradlew --no-daemon publishAllPublicationsToDistFolder publishToSonatype
          fi

  publish_pages:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Build JavaScript client
        run: ./gradlew --no-daemon :nostrads-js:packJsClient
      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p dist/deploy
          cp -r nostrads-js/src/. dist/deploy/
          sed -i 's/"testmode":true,/"testmode":false,/g' dist/deploy/console/config.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/deploy
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  publish_delegate:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    environment: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Build delegate JAR
        run: ./gradlew --no-daemon :nostrads-delegate:shadowJar
      - name: Build and smoke-test container
        working-directory: nostrads-delegate
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}/nostrads-delegate
          IMAGE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || 'latest' }}
        run: |
          set -euo pipefail
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker build --pull -t "$IMAGE_NAME:$IMAGE_TAG" .
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop=ALL --security-opt=no-new-privileges "$IMAGE_NAME:$IMAGE_TAG" --verify-runtime
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish delegate container with attestations
        id: publish-container
        working-directory: nostrads-delegate
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}/nostrads-delegate
          IMAGE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || 'latest' }}
        run: |
          set -euo pipefail
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          SHA_TAG="sha-${GITHUB_SHA}"
          docker buildx build --pull --push --provenance=mode=max --sbom=true \
            --tag "$IMAGE_NAME:$IMAGE_TAG" --tag "$IMAGE_NAME:$SHA_TAG" .
          DIGEST=$(docker buildx imagetools inspect "$IMAGE_NAME:$SHA_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Sign delegate container
        env:
          IMAGE: ${{ steps.publish-container.outputs.image }}
          DIGEST: ${{ steps.publish-container.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
